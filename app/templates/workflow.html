<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务流程 — 绩效评价审计智能体</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">📊 绩效评价审计智能体</div>
    <div class="nav-links">
        <a href="/">首页</a>
        <a href="/projects">项目管理</a>
        <a href="/classifications">分类体系</a>
        <a href="/scoring/{{pid}}">评分</a>
        <a href="/report/{{pid}}">报告</a>
        <a href="/ai">AI助手</a>
    </div>
</nav>

<main class="container" id="workflowApp">
    <!-- 项目信息头 -->
    <div class="project-header" id="projectHeader">
        <div class="spinner"></div>
        <span>加载中...</span>
    </div>

    <!-- 流程进度条 -->
    <div class="progress-section">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText"></div>
    </div>

    <!-- 阶段导航 -->
    <div class="stage-nav" id="stageNav">
        <!-- JS动态渲染 -->
    </div>

    <!-- 当前阶段详情 -->
    <div class="stage-detail" id="stageDetail">
        <h2 id="stageName"></h2>
        <p id="stageDesc"></p>
        <div class="stage-meta">
            <span class="badge" id="stageTime"></span>
            <span class="badge" id="stageProgress"></span>
        </div>
    </div>

    <!-- 检查清单 -->
    <div class="card">
        <h3>✅ 检查清单 / 工作重点</h3>
        <ul class="checklist" id="checklist"></ul>
    </div>

    <!-- v6.0: 阶段工作包（前置/资料/法规/指引/沟通/重点） -->
    <div id="stageExtras"></div>

    <!-- 产出物 -->
    <div class="card">
        <h3>📦 阶段产出物</h3>
        <ul class="output-list" id="outputList"></ul>
    </div>

    <!-- v7.2: 阶段资料导入与记录 -->
    <div class="card">
        <h3>📥 本阶段资料导入与记录</h3>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem">
            <input type="file" id="stageFile" style="max-width:280px">
            <button class="btn btn-primary" onclick="uploadStageFile()">上传资料/文件</button>
        </div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-start">
            <select id="noteType">
                <option value="comm">💬 沟通协调(过程与结果)</option>
                <option value="prereq">⚡ 前置条件落实情况</option>
                <option value="note">📝 其他情况/备注</option>
            </select>
            <textarea id="noteText" rows="2" placeholder="记录本阶段沟通、协调、前置条件等情况…" style="flex:1;min-width:240px"></textarea>
            <button class="btn btn-secondary" onclick="saveStageNote()">保存记录</button>
        </div>
        <div id="stageRecords" style="margin-top:.8rem"></div>
    </div>

    <!-- v7.2: AI流程调整 -->
    <div class="card">
        <h3>🔧 AI 流程调整建议</h3>
        <p style="color:#666;font-size:.9rem">根据本阶段及之前导入的资料、记录的新情况，AI 分析后续阶段是否需要调整。</p>
        <button class="btn btn-primary" onclick="runAdjustPlan()">🤖 分析新情况并生成调整建议</button>
        <div id="adjustResult" style="margin-top:.8rem"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-bar">
        <button class="btn btn-primary" id="btnAdvance" onclick="advanceStage()">
            ➡️ 完成当前阶段，进入下一阶段
        </button>
        <div class="action-right">
            <select id="jumpStage" onchange="jumpTo(parseInt(this.value))">
                <option value="">跳转到阶段...</option>
            </select>
        </div>
    </div>

    <!-- 底稿生成区 -->
    <div class="card">
        <h3>📝 生成审计底稿</h3>
        <div class="paper-grid" id="paperGrid"></div>
    </div>

    <!-- 评分预览 -->
    <div class="card" id="scorePreview" style="display:none">
        <h3>📊 评分预览</h3>
        <div id="scoreContent"></div>
    </div>
</main>

<script>
const PID = "{{pid}}";
</script>
<script src="/static/js/app.js"></script>
<script src="/static/js/workflow.js"></script>
</body>
</html>
